name: Verify historical v0.1.0a1 release metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.1.0a1.yml"
      - "releases/v0.1.0a1.md"
      - "scripts/verify_historical_release_metadata.py"
      - "tests/test_release_workflow.py"
      - "tests/test_historical_release_metadata.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-historical-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test verifier on synthetic release metadata
        run: python -m unittest discover -s tests -p 'test_historical_release_metadata.py' -v

      - name: Inspect published release listing (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0a1" \
            | python scripts/verify_historical_release_metadata.py

      - name: Inspect historical tag ref (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0a1" \
            | python scripts/verify_historical_release_metadata.py --tag-ref
